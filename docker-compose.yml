version: "3.8"

services:
  # ---------------------------------------------------
  # 1) MariaDB - Hauptdienst
  # ---------------------------------------------------
  db:
    image: mariadb:11
    container_name: museum-mariadb
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_DATABASE:     "${DB_NAME}"
      MARIADB_USER:         "${DB_USER}"
      MARIADB_PASSWORD:     "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db_data:/var/lib/mysql
      # ----- Init-Scripts: Hier legen wir SQL-Dateien ab, die beim ersten Start
      #       der MariaDB-Instanz ausgeführt werden. So erzeugen wir die Haupt-
      #       datenbank und zusätzlich die Test-Datenbank automatisch.
      - ./database/init:/docker-entrypoint-initdb.d

  # ---------------------------------------------------
  # 2) Dev-Seed (nur im Dev-Profil) – Dummy-Daten in Test-DB
  # ---------------------------------------------------
  db-seed:
    image: mariadb:11
    container_name: museum-db-seed
    profiles:
      - dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: |
      sh -c '
        echo "🌱 Seeding Test-DB für Dev…";
        for f in /seed/*.sql; do
          echo "➡️ $${f}";
          mariadb \
            --host="$${DB_HOST:-db}" \
            --port="$${DB_PORT:-3306}" \
            --user="$${DB_MIGRATE_USER:-root}" \
            --password="$${DB_MIGRATE_PASSWORD:-}" \
            "$${DB_NAME}_test" < "$${f}"; 
        done
      '
    volumes:
      - ./database/dev-init:/seed

  # ---------------------------------------------------
  # 3) FastAPI-Backend
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: museum-backend
    profiles:
      - dev
    depends_on:
      db:
        condition: service_healthy
      db-seed:
        condition: service_started
    ports:
      - "8000:8000"
    # Liest .env aus (Projekt-Root)
    env_file:
      - .env
    environment:
      # Für Dev: APP_ENV=dev, APP_TEST_DATABASE_URL wird in config.py genutzt
      APP_ENV:                "${APP_ENV}"
      APP_DATABASE_URL:       "${APP_DATABASE_URL}"
      APP_TEST_DATABASE_URL:  "${APP_TEST_DATABASE_URL}"
      # Optional: APP_SECRET_KEY, APP_CORS_ALLOWED_ORIGINS etc. können ebenfalls hier gesetzt werden
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
    command: >
      sh -c "
        echo '--- ENV im FastAPI-Container ---';
        env | grep -E '^(APP_|DB_)';
        echo '-------------------------------';
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  db_data:
