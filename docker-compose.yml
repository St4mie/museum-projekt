services:
  # ---------------------------------------------------
  # MariaDB Hauptdienst
  # ---------------------------------------------------
  db:
    image: mariadb:11
    container_name: museum-mariadb
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_DATABASE:     "${DB_NAME}"
      MARIADB_USER:         "${DB_USER}"
      MARIADB_PASSWORD:     "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

  # ---------------------------------------------------
  # Dev-Seed (Testdaten)
  # nur mit `--profile dev`
  # ---------------------------------------------------
  db-seed:
    image: mariadb:11
    profiles:
      - dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: |
      sh -c '
        echo "🌱 Seeding Dev-DB…";
        for f in /seed/*.sql; do
          echo "➡️  $${f}";
          mariadb \
            --host="$${DB_HOST:-db}" \
            --port="$${DB_PORT:-3306}" \
            --user=root \
            --password="$${DB_ROOT_PASSWORD}" \
            "$${DB_NAME}" < "$${f}";
        done
      '
    volumes:
      - ./database/dev-init:/seed

  # ---------------------------------------------------
  # FastAPI-Backend mit Live-Mount & Migrations-Config
  # nur mit `--profile dev`
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: museum-backend
    profiles:
      - dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Runtime-Connection für den Service-User (nur Lese/Schreib)
      DATABASE_URL:         "${DATABASE_URL}"
      # Migrations-Connection für den Entwickler-User (volle Rechte)
      DATABASE_URL_MIGRATE: "${DATABASE_URL_MIGRATE}"
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static   # Statische Medien im Container
    command: >
      sh -c "
        # 1) Alembic-Migration automatisch vor dem Start, wenn URL gesetzt
        if [ -n \"${DATABASE_URL_MIGRATE}\" ]; then
          echo '🔄 Running migrations…';
          alembic upgrade head || echo '⚠️  Alembic nicht gefunden – bitte in requirements.txt aufnehmen';
        fi;
        # 2) Dann den Uvicorn-Server starten (Flags in einer Zeile!)
        echo '🚀 Starting FastAPI…';
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  db_data:
