[mypy]
python_version = 3.11


plugins =
    sqlalchemy.ext.mypy.plugin
    pydantic.mypy

# Basis-Checks
ignore_missing_imports = True      # missing third-party stubs ausblenden
check_untyped_defs = True          # prüfe auch untypisierte Funktionen
disallow_untyped_defs = False      # hier noch nicht alle ungetypten defs verbieten

# Optional stricter
strict_optional = True             # Optional[X] vs X klar trennen
no_implicit_optional = True        # Optional nur via Optional[...] erlauben

# Warnungen
warn_unused_ignores = True         # nicht‐genutzte "# type: ignore" markieren
warn_unused_configs = True         # nicht‐genutzte Mypy-Optionen melden
warn_redundant_casts = True        # unnötige Casts erkennen
warn_unreachable = True            # toter Code

# -----------------------------------------
# Einstellungen für das SQLAlchemy-Plugin
#
# Damit das Plugin deine Declarative Base kennt und
# Spalten-Typen richtig inferred, point it auf deine Base-Klasse.
[mypy.plugins.sqlalchemy]
# Pfad zur Base-Klasse (ggf. anpassen, falls du sie anders nennst)
base = "backend/app/models/base.py"
# (Optionen wie `dialect` oder `init_context` gibt’s noch, brauchst
# du aber meist nicht für ein Standard-Setup)
# -----------------------------------------
# Einstellungen für das Pydantic-Plugin
#
# Hier kannst du strengere Prüfungen auf ungetypte Felder oder
# ungültige Config-Werte aktivieren:
[pydantic-mypy]
warn_untyped_fields = True         # alle ungetypten Modell-Attribute warnen lassen
from_attributes = True             # gilt per Default für `orm_mode`-Ersatz
# Du könntest hier auch `warn_required_dynamic_aliases` oder
# `forbid_extra = True` setzen, wenn du ganz strikt sein willst.